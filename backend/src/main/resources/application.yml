server:
  port: 8080

spring:
  application:
    name: thesisforge-backend

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:thesisforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:thesisforge}
    password: ${MYSQL_PASSWORD:thesisforge}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 生产环境务必关闭，v1 面向本机开发
    clean-disabled: true

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（v1 开发默认值，生产环境务必替换）
thesisforge:
  jwt:
    secret: ${JWT_SECRET:thesisforge-dev-secret-key-please-change-in-production-0123456789}
    # token 有效期，单位：毫秒，默认 24 小时
    expire-millis: ${JWT_EXPIRE_MILLIS:86400000}
  # Node bridge 服务地址（托管 OpenCode，负责 git 操作）
  bridge:
    url: ${BRIDGE_URL:http://localhost:3010}

logging:
  level:
    com.thesisforge: debug
